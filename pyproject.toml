[project]
name = "file-line-counter-lib"
version = "0.1.1"
description = "Streams files line by line to count total lines, with options to exclude blank and comment lines."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
